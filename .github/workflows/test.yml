name: Test

# A pull request from a branch in this repository matches both `push` and
# `pull_request`, which ran the whole matrix twice for every change. Limiting
# the push trigger to main keeps one run per pull request, plus one on main
# after a merge - which is the run release.yml cuts a release from.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3']
        wp: ['latest']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
          tools: composer

      # install-wp-tests.sh checks the test suite out of develop.svn.wordpress.org,
      # and the runner images no longer ship subversion.
      - name: Install subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Run tests
        run: composer test
