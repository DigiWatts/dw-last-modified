name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two merges landing close together would otherwise race to update and merge
# the same release PR.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the manifest and CHANGELOG in its release PR, but not
  # the plugin header. Sync it on the PR branch so the tagged commit already
  # carries the right version.
  update-version-on-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the release PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          fetch-depth: 0

      - name: Sync the plugin version
        run: |
          chmod +x ./bin/update-plugin-version.sh
          ./bin/update-plugin-version.sh

      - name: Commit and push to the release PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "chore: sync plugin version"
          git push

  # Merge the release PR straight away so every change that lands on main ships
  # as a release. Pushes made with GITHUB_TOKEN don't start new workflow runs,
  # so the merge can't rely on this workflow firing again - the release is cut
  # by release-after-merge below, in this same run.
  merge-release-pr:
    needs: [release-please, update-version-on-pr]
    runs-on: ubuntu-latest

    steps:
      - name: Merge the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ fromJSON(needs.release-please.outputs.pr).number }}
        run: |
          # GitHub recomputes mergeability after the version-sync push, so the
          # first attempts can be refused while that is still pending.
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$PR_NUMBER" --squash; then
              exit 0
            fi
            echo "Merge attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          exit 1

  release-after-merge:
    needs: merge-release-pr
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  # Runs for a release cut by either release-please job: the first one covers
  # a release PR that was merged by hand.
  build-plugin:
    needs: [release-please, release-after-merge]
    if: >-
      always() && (
        needs.release-please.outputs.release_created == 'true' ||
        needs.release-after-merge.outputs.release_created == 'true'
      )
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name || needs.release-after-merge.outputs.tag_name }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Build the plugin zip
        run: |
          chmod +x ./bin/build.sh
          ./bin/build.sh

      - name: Upload the zip to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: dw-last-modified.zip
